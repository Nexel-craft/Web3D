<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercice 6 — Collisions physiques</title>
</head>
<body>
  <p style="position: fixed; top: 10px; left: 10px; z-index: 1000; background: #fff; padding: 6px 10px; border: 1px solid #000; margin: 0;"><a href="index.html">← Retour à l'accueil</a> — W/A/S/D pour se déplacer, Espace pour sauter (au sol). Bouton gauche + souris pour orbiter, molette pour zoomer.</p>

  <a-scene physics="gravity: -9.8">
    <a-sky src="assets/textures/sky.jpg"></a-sky>
    <a-box id="ground" static-body="shape: box" src="assets/textures/grass.jpg" repeat="15 15" width="40" height="0.4" depth="40" position="0 -0.2 0"></a-box>
    <a-light type="ambient" intensity="0.65"></a-light>
    <a-light type="directional" intensity="0.9" position="-2 5 3"></a-light>

    <a-box id="player" color="#ff6b6b" width="1" height="1" depth="1" position="0 1 0" dynamic-body="shape: box; mass: 2" physics-player="speed: 5; acceleration: 12; jumpSpeed: 6; cameraRelative: true"></a-box>

    <a-box dynamic-body="shape: box; mass: 2" color="#4ecdc4" position="3 1.5 0"></a-box>
    <a-box dynamic-body="shape: box; mass: 2" color="#ffe66d" position="-3 1.5 1"></a-box>
    <a-box dynamic-body="shape: box; mass: 2" color="#a29bfe" position="0 1.5 3"></a-box>
    <a-box dynamic-body="shape: box; mass: 2" color="#fd79a8" position="-2 1.5 -3"></a-box>
    <a-box dynamic-body="shape: box; mass: 2" color="#55efc4" position="2 2.5 -2" width="1.4" height="1.4" depth="1.4"></a-box>
    <a-box dynamic-body="shape: box; mass: 2" color="#fab1a0" position="-1 2.5 2"></a-box>
    <a-box dynamic-body="shape: box; mass: 2" color="#81ecec" position="4 1 0" width="0.8" height="0.8" depth="0.8"></a-box>
    <a-box dynamic-body="shape: box; mass: 2" color="#dfe6e9" position="-4 1.5 -1"></a-box>

    <a-entity id="camera-rig" orbit-camera="target: #player; distance: 9; minDistance: 2; maxDistance: 22">
      <a-entity camera></a-entity>
    </a-entity>
  </a-scene>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@c-frame/aframe-physics-system@4.2.4/dist/aframe-physics-system.min.js"></script>
  <script src="js/components.js"></script>
</body>
</html>
